<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="meta.contact.title">Contact — Ax402 Demo Shop</title>
    <meta name="description" content="Contact Ax402 Demo Shop." />
    <meta name="theme-color" content="#3a0610" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/site.css" />
  </head>
  <body>
    <header class="page-strip" aria-label="Contact">
      <div class="page-strip-plane" aria-hidden="true"></div>
      <div class="wrap page-strip-inner">
        <div class="page-strip-top">
          <a class="brand-mark" href="/">Ax402 Demo Shop</a>
          <button type="button" class="nav-toggle" data-nav-toggle aria-expanded="false" aria-controls="site-nav" aria-label="Menu">
            <span class="nav-toggle-bars" aria-hidden="true"><span></span></span>
          </button>
          <nav id="site-nav">
            <a href="/shop/" data-i18n="nav.shop">Shop</a>
            <a href="/checkout/" class="nav-cart">
              <span data-i18n="nav.cart">Cart</span>
              <span data-cart-count class="cart-badge" hidden>0</span>
            </a>
            <a href="/how-it-works/" data-i18n="nav.how">How it works</a>
            <a href="/about/" data-i18n="nav.about">About</a>
            <a href="/contact/" aria-current="page" data-i18n="nav.contact">Contact</a>
            <button type="button" class="lang-btn" data-lang-toggle>EN</button>
          </nav>
        </div>
        <h1 class="page-strip-title" data-i18n="contact.title">Contact</h1>
        <p class="page-strip-lede" data-i18n="contact.lede">Write to the band. We read every message.</p>
      </div>
    </header>

    <div class="wrap">
      <main>
        <section class="panel contact-panel">
          <form id="contact-form" class="contact-form" novalidate>
            <label for="contact-name" data-i18n="contact.name">Name</label>
            <input id="contact-name" name="name" type="text" autocomplete="name" required maxlength="120" data-i18n-placeholder="contact.name_ph" placeholder="Your name" />

            <label for="contact-email" data-i18n="contact.email">Email</label>
            <input id="contact-email" name="email" type="email" autocomplete="email" required maxlength="200" data-i18n-placeholder="contact.email_ph" placeholder="you@example.com" />

            <label for="contact-message" data-i18n="contact.message">Message</label>
            <textarea id="contact-message" name="message" rows="7" required maxlength="4000" data-i18n-placeholder="contact.message_ph" placeholder="Your message"></textarea>

            <!-- Honeypot — leave empty -->
            <div class="hp" aria-hidden="true">
              <label for="contact-company">Company</label>
              <input id="contact-company" name="company" type="text" tabindex="-1" autocomplete="off" />
            </div>

            <div id="contact-turnstile" class="turnstile-slot" aria-live="polite"></div>

            <button type="submit" class="btn" id="contact-submit" data-i18n="contact.submit">Send message</button>
            <p class="msg" id="contact-msg" role="status"></p>
          </form>
        </section>
      </main>

      <footer class="foot">
        <div class="foot-links">
          <a href="https://archonia.org" rel="noopener" data-i18n="footer.ax402">Ax402</a>
          <a href="https://archonia.org" rel="noopener">© Ax402 / archonia.org</a>
        </div>
        <a href="/how-it-works/" data-i18n="footer.how">How it works</a>
      </footer>
    </div>
    <script src="/assets/site.js"></script>
    <script src="/assets/cart.js"></script>
    <script src="/assets/contact.js"></script>
  </body>
</html>
